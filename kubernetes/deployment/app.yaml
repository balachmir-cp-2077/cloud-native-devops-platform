apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-native-app
  namespace: cloud-native-app
  labels:
    app: cloud-native-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-native-app

  template:
    metadata:
      labels:
        app: cloud-native-app

    spec:
      containers:
        - name: cloud-native-app
          image: cloud-native-app:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
              protocol: TCP

          env:
            - name: APP_ENV
              value: "kubernetes"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20