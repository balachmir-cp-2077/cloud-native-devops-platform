name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          pytest app/tests -v

  docker:
    name: Build, scan and push Docker image
    runs-on: ubuntu-24.04

    needs: test

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-central-1
      AWS_ACCOUNT_ID: "432837989123"
      ECR_REPOSITORY: cloud-native-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            -t cloud-native-app:${{ github.sha }} \
            ./app

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-native-app:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::432837989123:role/GitHubActions-CloudNativePlatform-ECR
          aws-region: eu-central-1
          allowed-account-ids: "432837989123"

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Tag image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag \
            cloud-native-app:${{ github.sha }} \
            "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${{ github.sha }}"

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push \
            "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${{ github.sha }}"
