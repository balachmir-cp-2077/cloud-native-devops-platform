
replicaCount: 2

image:
  repository: 432837989123.dkr.ecr.eu-central-1.amazonaws.com/cloud-native-app
  tag: "af52a7fb03e07c68132498ebb107b16a7d56370f"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-registry-secret

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  host: cloud-native.local

app:
  environment: kubernetes
  logLevel: INFO

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
